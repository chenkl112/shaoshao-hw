# 复制为 serial.navcar.yaml，填写实际串口；Navcar V2（线格式 VERSION 仍为 1）默认只读。
transport: navcar_uart1_v1
state_semantics: wheel_velocity_v2
feedback_protocol: navcar_uart1_v2  # 下位机原版 V2，仅使用 0x01/0x80/0x81。
feedback_frame: map  # 仅当当前 MCU 固件实测输出云台/世界系 XY 时使用 map。
serial_port: null  # 通过 ls -l /dev/serial/by-id/ 获取，禁止猜测。
baud: 2000000
yaw_target_deg: 0.0  # 相对 MCU 启动航向，不是相对底盘的关节角。
# 下位机现已直接使用实际 m/s，不再乘以倍率。
forward_units_per_mps: 1.0
left_units_per_mps: 1.0
rot_units_per_radps: 1.0
max_translation_units: 0.3
max_rot_units: 6.0
